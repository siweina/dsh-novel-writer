name: Package & Release
# v4.0.0：测试门禁——此前唯一测试入口挂在发布工作流上（只有 tag/手动触发才跑），
# 普通分支推送与 PR 完全没有测试。现在 push（所有分支）与 pull_request 都会跑 test job，发布 job 用 needs: test 卡住。
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Run tests
        run: |
          node test/unit-test.mjs
          node test/e2e-test.mjs
          node test/pattern-test.mjs
          node test/client-test.mjs
  package:
    needs: test
    # 打包/发布只在 tag 或手动触发时执行（分支推送只跑测试，不产出多余 artifact）
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install zip
        run: sudo apt-get install -y zip
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Get version
        id: ver
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare bundle
        run: |
          mkdir -p dist
          # v4.0.0：补 --exclude='node_modules'——此前 npm ci 装出的依赖树（本机 142MB）会被整包打进 release zip；
          # 依赖由用户侧 npm install/dsh plugin add 安装。同时删掉过时排除项 .e2e-test/.f39/.f3*（测试早已改用 tmpdir，永不匹配）。
          rsync -a --exclude='node_modules' --exclude='.github' --exclude='dist' --exclude='*.zip' --exclude='.git' --exclude='.novel-writer' --exclude='_*.mjs' --exclude='*.bak*' ./ dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}/
      - name: Create zip
        run: cd dist && zip -r ../dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          path: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
          # 更新日志手动填写：Release 创建后由作者/助手用 gh release edit 补充 notes
          body: |
            # dsh-novel-writer v${{ steps.ver.outputs.VERSION }}

            （更新日志待手动填写——发布后运行 gh release edit 补充说明）
