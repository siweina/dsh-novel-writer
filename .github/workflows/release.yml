name: Package & Release

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  package:
    needs: test
    # 手动执行只生成测试产物；只有推送版本 tag 才发布。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # Trusted publishing 要求 npm >= 11.5.1。
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build:check
      - run: node tools/check-release.mjs
      - name: Get version
        id: ver
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare plugin bundle
        run: |
          mkdir -p dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          # 白名单避免把依赖、缓存、站点或开发凭证装进插件 ZIP。
          cp -r lib mcp skills tools test package.json package-lock.json cordis.patch.yml README.md README.en.md CHANGELOG.md LICENSE server.json smithery.yaml Dockerfile glama.json dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}/
          cd dist
          zip -qr ../dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
      - name: Prepare npm tarball
        run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          path: |
            dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
            dist/*.tgz
      - name: Publish to npm via OIDC
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: npm publish dist/dsh-novel-writer-${{ steps.ver.outputs.VERSION }}.tgz --access public --registry https://registry.npmjs.org/
      - name: Extract release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
            dist/*.tgz
          body_path: release-notes.md

  mcp-registry:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-mcp.yml
    permissions:
      contents: read
      id-token: write

