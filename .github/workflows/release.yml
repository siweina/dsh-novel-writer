name: Package & Release

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 注意：不要把 TEMP/TMP 写在 job 级 env 里——runner 上下文在 jobs.<job_id>.env 不可用，
    # 会让工作流整体无法解析（运行 0 秒 0 job，名字退化成文件路径）。测试改为自行规范化临时目录。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  package:
    needs: test
    # 手动执行只生成测试产物；只有推送版本 tag 才发布。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # Trusted publishing 要求 npm >= 11.5.1。
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build:check
      - run: node tools/check-release.mjs
      - name: Get version
        id: ver
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare plugin bundle
        run: |
          mkdir -p dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          # 白名单避免把依赖、缓存、站点或开发凭证装进插件 ZIP。
          cp -r lib mcp skills tools test package.json package-lock.json cordis.patch.yml README.md README.en.md CHANGELOG.md LICENSE server.json smithery.yaml Dockerfile glama.json dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}/
          cd dist
          zip -qr ../dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
      - name: Prepare npm tarball
        run: npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          path: |
            dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
            dist/*.tgz
      - name: Verify npm credentials
        # 凭据自检：确认仓库 secret NPM_TOKEN 已正确接入并可用。
        # tag 发布会用它发版；workflow_dispatch（只出测试产物、不发布）也会跑它——
        # 这样可以在不真正发包的前提下验证接线，失败时一眼分辨「凭据问题」还是「打包问题」。
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry https://registry.npmjs.org/
      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        # 认证走仓库 secret NPM_TOKEN，不再依赖 OIDC：npm 侧未配置 Trusted Publisher 时，
        # OIDC 发布会返回 `404 PUT /<pkg>`（npm 用 404 避免泄露包是否存在），
        # 而这一步失败会把后面的 Create Release 与 MCP Registry 一起跳过。
        # 另外，tarball 路径必须以 ./ 开头：npm 会把 `dist/xxx.tgz` 当成 GitHub 的 `user/repo` 简写
        # （实测 `git ls-remote ssh://git@github.com/dist/dsh-novel-writer-6.3.0.tgz.git`
        # → Permission denied (publickey)），此前这一步因此从未真正发出过包。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.VERSION }}"
          if npm view "dsh-novel-writer@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::npm 上已存在 dsh-novel-writer@$VERSION（重跑同一 tag 时会遇到），跳过发布；Release 与 MCP 元数据照常继续。"
          else
            npm publish "./dist/dsh-novel-writer-$VERSION.tgz" --access public --registry https://registry.npmjs.org/
          fi
      - name: Extract release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node tools/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
            dist/*.tgz
          body_path: release-notes.md

  mcp-registry:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/publish-mcp.yml
    permissions:
      contents: read
      id-token: write

