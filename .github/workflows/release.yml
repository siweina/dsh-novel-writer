name: Package & Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install zip
        run: sudo apt-get install -y zip
      - name: Install dependencies
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Get version
        id: ver
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          node test/unit-test.mjs
          node test/e2e-test.mjs
          node test/pattern-test.mjs
          node test/client-test.mjs
      - name: Prepare bundle
        run: |
          mkdir -p dist
          rsync -a --exclude='.github' --exclude='dist' --exclude='*.zip' --exclude='.e2e-test' --exclude='.git' --exclude='.novel-writer' --exclude='_*.mjs' --exclude='.f39' --exclude='*.bak*' --exclude='.f3*' ./ dist/dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}/
      - name: Create zip
        run: cd dist && zip -r ../dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}
          path: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --registry https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-novel-writer-v${{ steps.ver.outputs.VERSION }}.zip
          # 更新日志手动填写：Release 创建后由作者/助手用 gh release edit 补充 notes
          body: |
            # dsh-novel-writer v${{ steps.ver.outputs.VERSION }}

            （更新日志待手动填写——发布后运行 gh release edit 补充说明）