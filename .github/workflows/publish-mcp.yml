name: Publish to MCP Registry
# v4.1.1：把包内的 stdio MCP 服务器发布到官方 MCP Registry（registry.modelcontextprotocol.io）。
# 认证用 GitHub OIDC，不需要任何 token / secret。
# 顺序要求：Registry 通过 npm 包 package.json 里的 mcpName 校验归属，
# 因此这里先等 npm 上出现该版本，再发布元数据（避免与 release.yml 的 npm publish 抢跑）。
on:
  workflow_call:
  # v6.3.0：允许手动单独触发。release.yml 把 MCP 发布串在 package 作业之后，
  # 一旦 npm 那一步失败（例如 npm 侧尚未配置可信发布），MCP 元数据就再没有机会发出——
  # 而它其实只依赖「npm 上该版本已就绪」，与 npm 那一步是否由 CI 完成无关。
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release metadata
        run: node tools/check-release.mjs
      - name: Wait for npm package to be available
        run: |
          VERSION=$(node -p "require('./server.json').version")
          for i in $(seq 1 30); do
            if npm view "dsh-novel-writer@$VERSION" version >/dev/null 2>&1; then
              echo "npm: dsh-novel-writer@$VERSION 已上线"
              exit 0
            fi
            echo "等待 npm 包 $VERSION（$i/30）…"
            sleep 20
          done
          echo "npm 包在 10 分钟内未出现，放弃"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
