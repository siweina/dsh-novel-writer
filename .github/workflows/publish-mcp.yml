name: Publish to MCP Registry
# v4.1.1：把包内的 stdio MCP 服务器发布到官方 MCP Registry（registry.modelcontextprotocol.io）。
# 认证用 GitHub OIDC，不需要任何 token / secret。
# 顺序要求：Registry 通过 npm 包 package.json 里的 mcpName 校验归属，
# 因此这里先等 npm 上出现该版本，再发布元数据（避免与 release.yml 的 npm publish 抢跑）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for npm package to be available
        run: |
          VERSION=$(node -p "require('./server.json').version")
          for i in $(seq 1 30); do
            if npm view "dsh-novel-writer@$VERSION" version >/dev/null 2>&1; then
              echo "npm: dsh-novel-writer@$VERSION 已上线"
              exit 0
            fi
            echo "等待 npm 包 $VERSION（$i/30）…"
            sleep 20
          done
          echo "npm 包在 10 分钟内未出现，放弃"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
